<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远境传说</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="lobby.css"></head>
<body>
<header><button class="brand" id="brand-home"><span class="brand-icon">✧</span> <span data-i18n="brand"></span><small>WILDS & WONDERS</small></button><nav class="main-nav"><button id="nav-lobby" data-i18n="lobby"></button><button id="nav-adventure" data-i18n="adventure"></button></nav><label class="language-control"><span>◎</span><select id="language" aria-label="语言 / Language / 言語"><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label><button id="help" data-i18n="help"></button></header>
<div id="storage-warning" role="status" hidden data-i18n="storageWarning"></div>
<main id="lobby-view">
<section class="lobby-heading"><div><div class="eyebrow" data-i18n="campEyebrow"></div><h1 data-i18n="campTitle"></h1><p data-i18n="campSubtitle"></p></div><span class="camp-status"><i></i><span data-i18n="campSafe"></span></span></section>
<div class="lobby-layout">
<section class="showcase"><div class="showcase-top"><span data-i18n="onDisplay"></span><span id="display-number"></span></div><div class="hero-scene" id="hero-scene"><div class="scene-stars"></div><div class="scene-mountains"></div><div class="display-orbit orbit-one"></div><div class="display-orbit orbit-two"></div><div class="hero-pedestal"></div><div id="display-art"></div><span class="scene-caption">✧</span></div><div class="showcase-bottom"><div><div class="eyebrow" id="display-role"></div><h2 id="display-name"></h2><p id="display-quote"></p></div><div class="skin-picker"><label for="skin-select" data-i18n="appearance"></label><select id="skin-select"></select><small id="appearance-count"></small></div></div></section>
<aside class="camp-sidebar"><section class="campaign-card"><div class="eyebrow" data-i18n="chapterOne"></div><h2 data-i18n="campaignTitle"></h2><p data-i18n="campaignSynopsis"></p><div id="campaign-progress"></div><div class="next-destination"><span data-i18n="nextDestination"></span><strong id="destination-name"></strong></div><button class="primary" id="depart"></button><button class="text-button" id="journal-open" data-i18n="journal"></button></section><section class="panel display-profile"><div class="panel-heading"><h2 data-i18n="companionProfile"></h2><span>✧</span></div><div id="display-profile"></div></section></aside>
</div>
<section class="collection-section"><div class="roster-heading"><div><h2 data-i18n="collection"></h2><p data-i18n="collectionHint"></p></div><span id="owned-count" class="muted"></span></div><div id="collection"></div></section>
</main>
<main id="adventure-view" hidden>
<section class="title-row"><div><div class="eyebrow" data-i18n="chapterOne"></div><h1 data-i18n="adventureTitle"></h1><p data-i18n="adventureSubtitle"></p></div><div class="chapter"><span data-i18n="adventureProgress"></span><strong id="progress"></strong></div></section>
<nav id="stages" data-i18n-aria="adventure"></nav>
<section class="story-brief"><span class="story-symbol">✧</span><div><strong id="objective-title"></strong><p id="objective-text"></p></div><button id="story-recap" data-i18n="readStory"></button></section>
<div class="game-layout">
<aside class="panel traits-panel"><div class="panel-heading"><h2 data-i18n="teamTraits"></h2><span id="trait-count"></span></div><p class="muted small" data-i18n="traitHint"></p><div id="traits"></div><div class="tip"><span data-i18n="noteTitle"></span><p data-i18n="noteText"></p></div></aside>
<section class="arena-panel"><div class="arena-head"><div><span id="phase" class="status"></span><h2 id="stage-title"></h2></div><div class="arena-tools"><span id="timer">00:00</span><button id="speed" data-i18n-title="speed">1×</button><button id="pause" disabled></button></div></div><div class="board-wrap"><canvas id="board" width="960" height="660" data-i18n-aria="boardAria"></canvas><div id="result" class="result" hidden></div></div><div class="arena-footer"><span><i class="dot blue"></i><span data-i18n="allies"></span><span class="divider">/</span><i class="dot red"></i><span data-i18n="enemies"></span></span><span id="board-hint"></span></div><div class="command-bar"><div><strong id="team-count"></strong><span data-i18n="deployed"></span><button id="reset" data-i18n="reset"></button></div><button class="primary" id="start" data-i18n="start"></button></div></section>
<aside class="right-column"><section class="panel details"><div class="panel-heading"><h2 data-i18n="heroProfile"></h2><span>✧</span></div><div id="details"></div></section><section class="panel log-panel"><div class="panel-heading"><h2 data-i18n="combatLog"></h2><span class="live" data-i18n="live"></span></div><div id="log" aria-live="polite"></div></section></aside>
</div>
<section class="roster-section"><div class="roster-heading"><div><h2 data-i18n="yourTeam"></h2><p data-i18n="rosterHint"></p></div><span class="muted" data-i18n="rosterCount"></span></div><div id="roster"></div></section>
</main>
<footer class="app-footer"><span>✧ <span data-i18n="brand"></span></span><span data-i18n="footer"></span><span data-i18n="autoSave"></span></footer>
<dialog id="guide"><button id="close-help" class="close" data-i18n-aria="close">×</button><div class="eyebrow" data-i18n="help"></div><h2 data-i18n="guideTitle"></h2><p data-i18n="guide1"></p><p data-i18n="guide2"></p><p data-i18n="guide3"></p><p data-i18n="guide4"></p><button id="got-it" class="primary" data-i18n="gotIt"></button></dialog>
<dialog id="story-dialog" aria-labelledby="story-title"><div class="story-dialog-top"><span class="eyebrow" id="story-kicker"></span><label><select id="story-language" aria-label="语言 / Language / 言語"><option value="zh">简体中文</option><option value="en">English</option><option value="ja">日本語</option></select></label></div><div id="story-dialog-art" aria-hidden="true"></div><h2 id="story-title"></h2><p id="story-narration"></p><blockquote><span id="story-speaker"></span><p id="story-dialogue"></p></blockquote><div class="story-objective"><small data-i18n="objective"></small><p id="story-goal"></p></div><div class="story-actions"><button id="story-dismiss" data-i18n="close"></button><button id="story-next" class="primary"></button></div></dialog>
<dialog id="journal-dialog"><button id="journal-close" class="close" data-i18n-aria="close">×</button><div class="eyebrow" data-i18n="chapterOne"></div><h2 data-i18n="journal"></h2><p data-i18n="journalHint"></p><div id="journal-entries"></div></dialog>
<script src="localization.js"></script><script src="story.js"></script><script src="game.js"></script><script src="lobby.js"></script>
</body></html>
